[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hstitch"
version = "0.1.0"
description = "Horizontal image concatenation and seam blending built on the OpenCV stitching module"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "opencv-contrib-python>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
hstitch = "hstitch.cli:main"

[tool.setuptools]
packages = ["hstitch", "hstitch.video", "hstitch.server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
